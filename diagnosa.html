<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagnosa Otomatis Teknisi</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}

h2{text-align:center;}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

input, select{
  width:100%;
  padding:8px;
  margin:5px 0 15px;
  border-radius:6px;
  border:none;
}

button{
  padding:10px;
  width:100%;
  background:#22c55e;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}

.result{
  margin-top:20px;
  padding:15px;
  background:#111827;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>🧠 Diagnosa Otomatis Teknisi</h2>

<div class="card">

<label>Tipe HP:</label>
<input type="text" id="tipe" placeholder="Contoh: Redmi Note 8">

<label>Arus Standby (A):</label>
<input type="number" step="0.01" id="standby" placeholder="0.00">

<label>Arus Saat Tekan Power (A):</label>
<input type="number" step="0.01" id="power" placeholder="0.10">

<label>Gejala:</label>
<select id="gejala">
<option value="mati">Mati Total</option>
<option value="bootloop">Bootloop</option>
<option value="restart">Restart Sendiri</option>
<option value="nocharge">Tidak Charging</option>
<option value="nosignal">Tidak Ada Sinyal</option>
<option value="blank">Blank Display</option>
</select>

<button onclick="diagnosa()">Analisa Sekarang</button>

<div id="hasil" class="result"></div>

</div>

<script>

function diagnosa(){

let tipe = document.getElementById("tipe").value;
let standby = parseFloat(document.getElementById("standby").value);
let power = parseFloat(document.getElementById("power").value);
let gejala = document.getElementById("gejala").value;

let hasil = "";

if(gejala=="mati"){
    if(standby==0){
        hasil="🔴 Tidak ada arus → Cek jalur VBAT / IC Charger";
    }else if(standby>0 && standby<0.05){
        hasil="🟡 Arus kecil → CPU / eMMC tidak respon";
    }else if(standby>1){
        hasil="🔥 Short jalur utama";
    }
}

if(gejala=="bootloop"){
    hasil="⚠️ Kemungkinan Storage (eMMC/UFS) error → Coba Flash / Reball";
}

if(gejala=="restart"){
    hasil="⚡ Cek PMIC / baterai drop";
}

if(gejala=="nocharge"){
    hasil="🔌 Cek IC Charger / Jalur USB";
}

if(gejala=="nosignal"){
    hasil="📡 Cek RF IC / PA / Antena";
}

if(gejala=="blank"){
    hasil="🖥️ Cek jalur backlight / IC display";
}

document.getElementById("hasil").innerHTML =
"<b>Tipe HP:</b> "+tipe+"<br><br><b>Hasil Diagnosa:</b><br>"+hasil;

}

</script>

</body>
</html>

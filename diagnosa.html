<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagnosa Otomatis V2</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}

h2{text-align:center;}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

input, select{
  width:100%;
  padding:8px;
  margin:5px 0 15px;
  border-radius:6px;
  border:none;
}

button{
  padding:10px;
  width:100%;
  background:#22c55e;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}

.result{
  margin-top:20px;
  padding:15px;
  background:#111827;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>🧠 Diagnosa Otomatis Teknisi V2</h2>

<div class="card">

<label>Tipe HP:</label>
<input type="text" id="tipe" placeholder="Contoh: Redmi Note 8">

<label>Arus Standby (A):</label>
<input type="number" step="0.01" id="standby" placeholder="0.00">

<label>Arus Saat Tekan Power (A):</label>
<input type="number" step="0.01" id="power" placeholder="0.10">

<label>Gejala:</label>
<select id="gejala">
<option value="mati">Mati Total</option>
<option value="bootloop">Bootloop</option>
<option value="restart">Restart Sendiri</option>
<option value="nocharge">Tidak Charging</option>
<option value="nosignal">Tidak Ada Sinyal</option>
<option value="blank">Blank Display</option>
</select>

<button onclick="diagnosa()">Analisa Sekarang</button>

<div id="hasil" class="result"></div>

</div>

<script>

// ============================
// DATABASE PER TIPE HP
// ============================

const databaseHP = {

"redmi note 8":{
cpu:"Snapdragon 665",
storage:"eMMC",
common:"Sering eMMC bad sector"
},

"oppo a5s":{
cpu:"Helio P35",
storage:"eMMC",
common:"Sering short PMIC"
},

"samsung a10":{
cpu:"Exynos 7884",
storage:"eMMC",
common:"Bootloop karena storage"
}

};

// ============================
// SMART RULE LOGIC
// ============================

function diagnosa(){

let tipe = document.getElementById("tipe").value.toLowerCase();
let standby = parseFloat(document.getElementById("standby").value);
let power = parseFloat(document.getElementById("power").value);
let gejala = document.getElementById("gejala").value;

let hasil = "";
let infoHP = "";


// ==== Ambil database tipe HP ====

if(databaseHP[tipe]){
infoHP = `
<b>CPU:</b> ${databaseHP[tipe].cpu}<br>
<b>Storage:</b> ${databaseHP[tipe].storage}<br>
<b>Kasus Umum:</b> ${databaseHP[tipe].common}<br><br>
`;
}else{
infoHP = "⚠️ Tipe belum ada di database<br><br>";
}


// ==== RULE DETAIL ARUS ====

if(gejala=="mati"){

if(standby==0){
hasil="🔴 0.00A → Jalur VBAT putus / IC Charger mati";

}else if(standby>0 && standby<0.03){
hasil="🟡 0.02A Stuck → CPU / eMMC tidak respon";

}else if(power>0.30 && power<0.60){
hasil="⚠️ 0.40A lalu mati → Storage error / NAND rusak";

}else if(power>1){
hasil="🔥 1A ke atas → Short jalur utama";

}else{
hasil="Cek PMIC & output 1.8V / 3.3V";
}

}

if(gejala=="bootloop"){
hasil="⚠️ Bootloop → Kemungkinan besar storage rusak atau perlu reflash";
}

if(gejala=="restart"){
hasil="⚡ Restart → Cek baterai / PMIC drop";
}

if(gejala=="nocharge"){
hasil="🔌 Tidak charging → IC Charger / Jalur USB";
}

if(gejala=="nosignal"){
hasil="📡 No Signal → RF IC / PA / Antena";
}

if(gejala=="blank"){
hasil="🖥️ Blank → Jalur backlight / IC display";
}


// ==== TAMPILKAN HASIL ====

document.getElementById("hasil").innerHTML =
"<b>Tipe HP:</b> "+tipe+"<br><br>"
+infoHP+
"<b>Hasil Diagnosa:</b><br>"+hasil;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagnosa Otomatis Teknisi</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
  padding:20px;
}

h2{
  text-align:center;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}

input, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  margin-bottom:15px;
  border-radius:6px;
  border:none;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.btn-main{
  background:#22c55e;
  color:white;
}

.btn-blue{
  background:#3b82f6;
  color:white;
}

.result{
  margin-top:15px;
  background:#0f172a;
  padding:15px;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>🧠 Diagnosa Otomatis Teknisi</h2>

<div class="card">

<label>Tipe HP:</label>
<input list="listHP" id="tipe" placeholder="Ketik tipe HP...">

<datalist id="listHP">
<option value="Redmi Note 8">
<option value="Redmi Note 9">
<option value="Oppo A5s">
<option value="Oppo A3s">
<option value="Samsung A10">
<option value="Samsung A20">
<option value="Vivo Y12">
<option value="Vivo Y15">
<option value="Realme 5">
<option value="Realme C2">
</datalist>

<label>Arus Standby (A):</label>
<input type="number" step="0.01" id="standby">

<label>Arus Saat Tekan Power (A):</label>
<input type="number" step="0.01" id="power">

<label>Gejala:</label>
<select id="gejala">
<option value="mati total">Mati Total</option>
<option value="restart">Restart Terus</option>
<option value="hang logo">Hang Logo</option>
<option value="no signal">Tidak Ada Sinyal</option>
<option value="tidak cas">Tidak Mengisi</option>
</select>

<button class="btn-main" onclick="diagnosa()">Analisa Sekarang</button>
<button class="btn-blue" onclick="lihatRiwayat()">Lihat Riwayat</button>

<div id="hasil" class="result"></div>
<div id="riwayatBox" class="result"></div>

</div>

<script>

function diagnosa(){

let tipe = document.getElementById("tipe").value;
let standby = parseFloat(document.getElementById("standby").value);
let power = parseFloat(document.getElementById("power").value);
let gejala = document.getElementById("gejala").value;

let hasil = "";

if(standby == 0){
hasil = "⚠️ Jalur VBAT putus / IC Charger bermasalah";
}
else if(standby < 0.05){
hasil = "⚠️ CPU / eMMC tidak respon";
}
else if(power > 1){
hasil = "⚠️ Kemungkinan short jalur utama";
}
else if(gejala == "restart"){
hasil = "⚠️ Kemungkinan eMMC / UFS bad sector";
}
else if(gejala == "hang logo"){
hasil = "⚠️ Sistem corrupt / perlu flash ulang";
}
else{
hasil = "✅ Arus normal, cek software atau periferal";
}

document.getElementById("hasil").innerHTML =
"<b>Hasil Diagnosa:</b><br><br>" + hasil;

// Simpan riwayat
let history = JSON.parse(localStorage.getItem("riwayat")) || [];

history.push({
tipe: tipe,
standby: standby,
power: power,
gejala: gejala,
hasil: hasil,
tanggal: new Date().toLocaleString()
});

localStorage.setItem("riwayat", JSON.stringify(history));

}

function lihatRiwayat(){

let history = JSON.parse(localStorage.getItem("riwayat")) || [];

let html = "<b>Riwayat Diagnosa:</b><br>";

history.slice().reverse().forEach(item=>{
html += `
<hr>
<b>${item.tanggal}</b><br>
Tipe: ${item.tipe}<br>
Standby: ${item.standby}A<br>
Power: ${item.power}A<br>
Gejala: ${item.gejala}<br>
Hasil: ${item.hasil}<br>
`;
});

document.getElementById("riwayatBox").innerHTML = html;

}

</script>

</body>
</html>

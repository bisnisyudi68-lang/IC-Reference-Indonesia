<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mode Jalur Tracker</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}

h2{text-align:center;}

button{
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.pasif{background:#ef4444;color:white;}
.aktif{background:#22c55e;color:white;}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

ul{line-height:1.8;}
</style>
</head>

<body>

<h2>🧭 Mode Jalur Tracker PRO</h2>

<div style="text-align:center;">
<button class="pasif" onclick="showPasif()">MODE PASIF</button>
<button class="aktif" onclick="showAktif()">MODE AKTIF</button>
</div>

<div id="content" class="card"></div>

<script>

function showPasif(){
document.getElementById("content").innerHTML = `
<h3>🔴 MODE PASIF (HP Mati Total)</h3>
<ul>
<li>1️⃣ Ukur VBAT di konektor baterai</li>
<li>2️⃣ Cek jalur VBAT ke PMIC</li>
<li>3️⃣ Inject 4V → cek panas IC</li>
<li>4️⃣ Ukur output 1.8V & 3.3V</li>
<li>5️⃣ Jika Vcore tidak keluar → PMIC rusak</li>
<li>6️⃣ Jika arus 0.02A stuck → CPU / Storage</li>
<li>7️⃣ Jika 0.40A lalu mati → eMMC bad</li>
<li>8️⃣ Jika >1A short → jalur utama short</li>
</ul>
`;
}

function showAktif(){
document.getElementById("content").innerHTML = `
<h3>🟢 MODE AKTIF (HP Nyala Tapi Error)</h3>
<ul>
<li>1️⃣ Bootloop → cek storage (UFS/eMMC)</li>
<li>2️⃣ Restart sendiri → cek PMIC / baterai</li>
<li>3️⃣ No signal → cek RF IC & PA</li>
<li>4️⃣ Tidak charging → cek IC Charger</li>
<li>5️⃣ Blank display → cek jalur backlight</li>
<li>6️⃣ Panas berlebih → cek short CPU</li>
<li>7️⃣ Stuck logo → flash firmware</li>
<li>8️⃣ No touch → cek IC Touch</li>
</ul>
`;
}

</script>

</body>
</html>

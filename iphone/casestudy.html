<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study Teknisi PRO</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
}

h1{
  text-align:center;
  padding:20px 10px 10px;
}

.search-box{
  text-align:center;
  margin-bottom:20px;
}

#searchBox{
  width:90%;
  max-width:400px;
  padding:10px;
  border-radius:8px;
  border:none;
  font-size:14px;
}

#caseList{
  width:95%;
  margin:auto;
}

.case-card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.case-title{
  font-weight:bold;
  margin-bottom:8px;
  font-size:14px;
}

.level{
  font-size:11px;
  padding:3px 8px;
  border-radius:10px;
  margin-left:8px;
}

.basic{background:#16a34a;}
.advance{background:#f59e0b;}
.expert{background:#dc2626;}

.footer{
  text-align:center;
  opacity:0.5;
  padding:30px 10px;
  font-size:12px;
}
</style>
</head>

<body>

<h1>📚 Case Study iPhone (1–100)</h1>

<div class="search-box">
  <input type="text" id="searchBox" placeholder="Cari kasus...">
</div>

<div id="caseList"></div>

<div class="footer">
IC Reference Teknisi HP Indonesia • iPhone X ke atas
</div>

<script>

const caseList = document.getElementById("caseList");
const searchBox = document.getElementById("searchBox");

const brands = ["Samsung","Xiaomi","Oppo","Vivo","Realme","Huawei","Infinix","Tecno"];
const chipsets = ["MTK","Snapdragon","Exynos"];
const problems = [
"Mati Total 0.00A",
"Short VBAT",
"Bootloop Logo",
"No Signal IMEI Null",
"WiFi Tidak Aktif",
"Mic Mati",
"Kamera Hitam",
"Charging 0%",
"Overheat CPU",
"eMMC Corrupt",
"UFS Tidak Detect",
"Tidak Bisa Flash",
"Restart 3 Menit",
"Touch Tidak Respons",
"No Backlight",
"Fingerprint Error",
"Battery Drain Cepat",
"Tidak Bisa Update",
"SIM Tidak Terbaca",
"Layar Blank Putih"
];

const cases = [];

// Generate 100 kombinasi UNIK (bukan random)
for(let i=0;i<100;i++){

let brand = brands[i % brands.length];
let chip = chipsets[Math.floor(i / brands.length) % chipsets.length];
let problem = problems[i % problems.length];

let level = i%3===0 ? "expert" : i%2===0 ? "advance" : "basic";

cases.push({
title: `${brand} ${chip} - ${problem}`,
level: level
});

}

function getAnalisa(title){

if(title.includes("Mati Total"))
return "• Cek VBUS 5V<br>• Cek IC Charger<br>• Inject PSU<br>• Ganti PMIC";

if(title.includes("Short"))
return "• Mode diode test<br>• Inject 1V<br>• Cari IC panas<br>• Ganti IC short";

if(title.includes("Signal") || title.includes("SIM"))
return "• Cek IMEI<br>• Cek Baseband<br>• Reflash firmware<br>• Ganti RF IC";

if(title.includes("eMMC") || title.includes("UFS"))
return "• ISP test<br>• Flash ulang<br>• Replace storage";

if(title.includes("Mic"))
return "• Cek jalur mic<br>• Cek Audio IC<br>• Reball Audio IC";

if(title.includes("Kamera"))
return "• Test kamera lain<br>• Cek supply 1.8V<br>• Reball CPU jika perlu";

if(title.includes("Charging"))
return "• Cek IC Charger<br>• Cek jalur BSI<br>• Ganti IC charger";

if(title.includes("Overheat"))
return "• Monitor arus idle<br>• Thermal spray<br>• Ganti IC panas";

return "• Analisa arus<br>• Cek jalur utama<br>• Eksekusi perbaikan";

}

function renderCases(filter=""){
caseList.innerHTML="";
cases
.filter(c=>c.title.toLowerCase().includes(filter.toLowerCase()))
.forEach((c,index)=>{
caseList.innerHTML+=`
<div class="case">
<div class="title">
${index+1}. ${c.title}
<span class="level ${c.level}">${c.level.toUpperCase()}</span>
</div>
<div>
${getAnalisa(c.title)}
</div>
</div>
`;
});
}

renderCases();

searchBox.addEventListener("input",()=>{
renderCases(searchBox.value);
});

</script>

</body>
</html>

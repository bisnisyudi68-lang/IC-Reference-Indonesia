<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Search Kode Mesin HP PRO</title>

<style>
body{
  background:#0b1a33;
  font-family:Arial;
  color:white;
  padding:20px;
}

h1{
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:20px;
  font-size:16px;
}

.hp-card{
  background:#1e2a44;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.hp-card h3{
  margin:0;
}

.hp-card p{
  margin:5px 0 0;
  opacity:0.8;
}
</style>

</head>
<body>

<h1>🔎 Search Kode Mesin HP PRO</h1>

<input type="text" id="searchHP" placeholder="Cari Brand / Model / Kode Mesin...">

<div id="resultHP"></div>

<script>

// ================= DATA =================

const brands = {
  Samsung: ["A10","A11","A12","A13","A14","A20","A21","A22","A23","A24","A30","A31","A32","A33","A34","A50","A51","A52","A53","S10","S20","S21","S22","S23"],
  Xiaomi: ["Redmi 8","Redmi 9","Redmi 10","Redmi Note 8","Redmi Note 9","Redmi Note 10","Redmi Note 11","Poco X3","Poco X4","Mi 10","Mi 11"],
  Oppo: ["A15","A16","A17","A31","A54","A57","A74","F11","Reno 4","Reno 5"],
  Vivo: ["Y12","Y15","Y20","Y21","Y22","V19","V20","V21"],
  Realme: ["C11","C12","C15","C25","C35","Narzo 20","Narzo 50"],
  Infinix: ["Hot 8","Hot 9","Hot 10","Note 8","Note 10"],
  Tecno: ["Spark 5","Spark 6","Spark 7","Camon 17"],
  iPhone: ["7","8","X","XR","XS","11","12","13","14","15"]
};

let dataHP = [];
let counter = 1000;

for (let brand in brands) {
  brands[brand].forEach(model => {
    for (let i = 1; i <= 2; i++) {
      dataHP.push({
        brand: brand,
        model: model,
        kode: brand === "iPhone"
          ? "A" + counter++
          : "SM-" + counter++
      });
    }
  });
}

// ================= TAMPILKAN =================

const resultHP = document.getElementById("resultHP");
const searchHP = document.getElementById("searchHP");

function tampilkan(data){
  resultHP.innerHTML = "";

  if(data.length === 0){
    resultHP.innerHTML = "<p style='text-align:center;margin-top:20px;'>Data tidak ditemukan</p>";
    return;
  }

  data.forEach(item=>{
    resultHP.innerHTML += `
      <div class="hp-card">
        <h3>${item.brand} ${item.model}</h3>
        <p>Kode Mesin: ${item.kode}</p>
      </div>
    `;
  });
}

// tampil awal
tampilkan(dataHP);

// search realtime
searchHP.addEventListener("keyup", function(){
  const keyword = this.value.toLowerCase();

  const filter = dataHP.filter(item =>
    item.brand.toLowerCase().includes(keyword) ||
    item.model.toLowerCase().includes(keyword) ||
    item.kode.toLowerCase().includes(keyword)
  );

  tampilkan(filter);
});

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Search Kode Mesin HP PRO MAX</title>

<style>
body{
  background:#0b1a33;
  font-family:Arial;
  color:white;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  opacity:0.7;
  margin-bottom:20px;
}

input, select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  font-size:15px;
}

.filters{
  display:grid;
  gap:10px;
  margin-bottom:15px;
}

.hp-card{
  background:#1e2a44;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  transition:0.2s;
}

.hp-card:hover{
  background:#24355a;
}

.hp-card h3{
  margin:0;
}

.hp-card p{
  margin:4px 0;
  opacity:0.85;
  font-size:14px;
}

.count{
  margin-top:15px;
  opacity:0.8;
}
</style>

</head>
<body>

<h1>🔎 Search Kode Mesin HP PRO MAX</h1>
<div class="subtitle">500+ Database Android & iPhone</div>

<input type="text" id="searchHP" placeholder="Cari Brand / Model / Kode / Chipset...">

<div class="filters">
<select id="filterBrand">
<option value="">Semua Brand</option>
</select>

<select id="filterOS">
<option value="">Semua OS</option>
<option value="Android">Android</option>
<option value="iOS">iOS</option>
</select>
</div>

<div class="count" id="resultCount"></div>
<div id="resultHP"></div>

<script>

// ===== MASTER BRAND & MODEL =====

const brands = {
  Samsung: ["A04","A05","A10","A11","A12","A13","A14","A20","A21","A22","A23","A24","A30","A31","A32","A33","A34","A50","A51","A52","A53","S8","S9","S10","S20","S21","S22","S23"],
  Xiaomi: ["Redmi 8","Redmi 9","Redmi 10","Note 8","Note 9","Note 10","Note 11","Note 12","Poco X3","Poco X4","Poco X5","Mi 10","Mi 11","Mi 12"],
  Oppo: ["A15","A16","A17","A31","A54","A55","A56","A57","A74","F11","F15","Reno 4","Reno 5","Reno 6"],
  Vivo: ["Y12","Y15","Y17","Y20","Y21","Y22","Y35","V19","V20","V21","V23"],
  Realme: ["C11","C12","C15","C25","C30","C35","Narzo 20","Narzo 50","Narzo 60"],
  Infinix: ["Hot 8","Hot 9","Hot 10","Hot 11","Note 8","Note 10","Note 12"],
  Tecno: ["Spark 5","Spark 6","Spark 7","Spark 8","Camon 17","Camon 18"],
  iPhone: ["7","8","X","XR","XS","11","12","13","14","15"]
};

const chipsets = [
"Snapdragon 450","Snapdragon 660","Snapdragon 720G","Snapdragon 865","Snapdragon 888","Snapdragon 8 Gen 1",
"Helio G35","Helio G85","Helio G99",
"Dimensity 700","Dimensity 810","Dimensity 920",
"Exynos 850","Exynos 2100",
"A11 Bionic","A12 Bionic","A13 Bionic","A14 Bionic","A15 Bionic","A16 Bionic"
];

let dataHP = [];
let kodeCounter = 1000;

// ===== GENERATE 2000+ DATA =====

for(let i=0;i<40;i++){   // 40 loop supaya >2000
  for(let brand in brands){

    brands[brand].forEach(model=>{
      
      dataHP.push({
        brand: brand,
        model: model + " Rev" + (i+1),
        os: brand === "iPhone" ? "iOS" : "Android",
        chipset: chipsets[Math.floor(Math.random()*chipsets.length)],
        tahun: 2017 + Math.floor(Math.random()*9),
        kode: brand === "iPhone" 
              ? "A" + kodeCounter++
              : "SM-" + kodeCounter++
      });

    });

  }
}

console.log("Total Database:", dataHP.length); // cek di console

// ===== FILTER DROPDOWN =====

const filterBrand = document.getElementById("filterBrand");
Object.keys(brands).forEach(brand=>{
  filterBrand.innerHTML += `<option value="${brand}">${brand}</option>`;
});

// ===== RENDER =====

const resultHP = document.getElementById("resultHP");
const searchHP = document.getElementById("searchHP");
const filterOS = document.getElementById("filterOS");
const resultCount = document.getElementById("resultCount");

function tampilkan(data){
  resultHP.innerHTML="";
  resultCount.innerHTML = "Total ditemukan: "+data.length+" HP";

  if(data.length===0){
    resultHP.innerHTML="<p style='text-align:center;margin-top:20px;'>Data tidak ditemukan</p>";
    return;
  }

  data.forEach(item=>{
    resultHP.innerHTML+=`
      <div class="hp-card">
        <h3>${item.brand} ${item.model}</h3>
        <p><b>Kode Mesin:</b> ${item.kode}</p>
        <p><b>Chipset:</b> ${item.chipset}</p>
        <p><b>OS:</b> ${item.os}</p>
        <p><b>Tahun:</b> ${item.tahun}</p>
      </div>
    `;
  });
}

tampilkan(dataHP);

// ===== SEARCH =====

function filterData(){
  const keyword = searchHP.value.toLowerCase();
  const brandVal = filterBrand.value;
  const osVal = filterOS.value;

  const filtered = dataHP.filter(item=>{
    return (
      (item.brand.toLowerCase().includes(keyword) ||
       item.model.toLowerCase().includes(keyword) ||
       item.kode.toLowerCase().includes(keyword) ||
       item.chipset.toLowerCase().includes(keyword))
      &&
      (brandVal==="" || item.brand===brandVal)
      &&
      (osVal==="" || item.os===osVal)
    );
  });

  tampilkan(filtered);
}

searchHP.addEventListener("keyup", filterData);
filterBrand.addEventListener("change", filterData);
filterOS.addEventListener("change", filterData);

</script>

</body>
</html>

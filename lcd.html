<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LCD Master Database</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  opacity:0.7;
  margin-bottom:20px;
}

input, select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-bottom:10px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}

.brand{
  color:#22c55e;
  font-weight:bold;
}

.compat{
  margin-top:5px;
  font-size:14px;
  opacity:0.9;
}
</style>
</head>
<body>

<h1>📱 LCD MASTER DATABASE</h1>
<div class="subtitle">Persamaan LCD Teknisi Indonesia</div>

<input type="text" id="search" placeholder="Cari model...">

<select id="filterBrand">
<option value="">Semua Brand</option>
</select>

<div id="result"></div>

<script>

// ===== DATABASE LCD =====

const data = [

{brand:"ASUS", model:"Zenfone Max Pro M1 (ZB601KL / ZB602KL / X00TD)", compat:"Universal Touchscreen"},

{brand:"INFINIX", model:"Hot 10S / Hot 10T / Smart 6 Plus", compat:"Universal Incell"},
{brand:"INFINIX", model:"Hot 11", compat:"Standalone"},

{brand:"INFINIX", model:"Hot 12 Pro / Itel S18", compat:"Universal Incell"},
{brand:"INFINIX", model:"Hot 20 5G", compat:"Incell"},
{brand:"INFINIX", model:"Hot 20 Play", compat:"Incell Black"},
{brand:"INFINIX", model:"Hot 20i / Smart 6 HD / Hot 12i", compat:"Universal Incell"},
{brand:"INFINIX", model:"Hot 20S", compat:"Incell Black"},
{brand:"INFINIX", model:"Hot 30i / Smart 7 / Itel A70", compat:"Universal Incell"},
{brand:"INFINIX", model:"Hot 40 / Hot 40 Pro / Note 40X", compat:"Incell Full Touchscreen"},
{brand:"INFINIX", model:"Hot 50 Series", compat:"Incell Full Touchscreen"},
{brand:"INFINIX", model:"Hot 6 / 6 Pro / 6X", compat:"Incell"},
{brand:"INFINIX", model:"Hot 8 / Tecno Camon 12 / Spark 4", compat:"Universal Incell"},
{brand:"INFINIX", model:"Hot 9 / Note 7 Lite / Spark 5", compat:"Universal Incell"},
{brand:"INFINIX", model:"Hot 9 Play / Smart 4 Plus", compat:"Universal Incell"},
{brand:"INFINIX", model:"Hot S3", compat:"Incell"},
{brand:"INFINIX", model:"Note 10 / Note 11S / Note 10 Pro / Pova 2 / Pova 3", compat:"Universal Incell"},
{brand:"INFINIX", model:"Note 11 / Note 12 / Note 30 VIP", compat:"Universal Incell"},
{brand:"INFINIX", model:"Note 12 VIP", compat:"Incell"},
{brand:"INFINIX", model:"Note 12 (X676)", compat:"Incell Black"},
{brand:"INFINIX", model:"Note 30 / Hot 30 / Pova 5 / Spark 10 Pro", compat:"Universal Incell"},

{brand:"INFINIX", model:"Note 8", compat:"Universal"},
{brand:"INFINIX", model:"S5 / S5 Lite", compat:"Universal Incell"},
{brand:"INFINIX", model:"Smart 2", compat:"Incell"},
{brand:"INFINIX", model:"Smart 3 Plus / S4", compat:"Universal Incell"},
{brand:"INFINIX", model:"Smart 4 / 4C", compat:"Universal Incell"},
{brand:"INFINIX", model:"Smart 5 / Hot 10 Lite / Tecno KC5 / Itel P36", compat:"Universal Incell"},
{brand:"INFINIX", model:"Smart 6", compat:"Universal"},

{brand:"INFINIX", model:"Zero 30 5G", compat:"Incell"},
{brand:"INFINIX", model:"Zero 5 Pro", compat:"Incell"},
{brand:"INFINIX", model:"Zero 8 / 8i", compat:"Universal Incell"},
{brand:"INFINIX", model:"Zero Ultra", compat:"Incell"},
{brand:"INFINIX", model:"Zero X Neo", compat:"Standalone"},
{brand:"INFINIX", model:"Zero X Pro", compat:"Incell"},
{brand:"INFINIX", model:"Hot 7 Pro", compat:"Incell"}

];

// ===== FILTER BRAND =====

const filterBrand = document.getElementById("filterBrand");
const result = document.getElementById("result");
const search = document.getElementById("search");

const brands = [...new Set(data.map(item=>item.brand))];

brands.forEach(b=>{
filterBrand.innerHTML += `<option value="${b}">${b}</option>`;
});

function tampilkan(list){
result.innerHTML="";
if(list.length===0){
result.innerHTML="<p>Data tidak ditemukan</p>";
return;
}
list.forEach(item=>{
result.innerHTML+=`
<div class="card">
<div class="brand">${item.brand}</div>
<div>${item.model}</div>
<div class="compat">Kompatibel: ${item.compat}</div>
</div>
`;
});
}

tampilkan(data);

function filterData(){
const keyword = search.value.toLowerCase();
const brandVal = filterBrand.value;

const filtered = data.filter(item=>
(item.model.toLowerCase().includes(keyword)) &&
(brandVal==="" || item.brand===brandVal)
);

tampilkan(filtered);
}

search.addEventListener("keyup", filterData);
filterBrand.addEventListener("change", filterData);

</script>

</body>
</html>

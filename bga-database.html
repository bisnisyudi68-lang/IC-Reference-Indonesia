<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Database Package BGA</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1120;
    color:white;
}
h1{
    text-align:center;
    padding:20px;
    color:#00eaff;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
}
.card{
    background:#111c3a;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 15px #00eaff55;
    cursor:pointer;
    transition:0.3s;
}
.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #00eaff;
}
.card h2{
    margin:0;
    color:#00eaff;
}
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
}
.modal-content{
    background:#1e293b;
    padding:30px;
    border-radius:10px;
    width:300px;
    text-align:center;
}
button{
    margin-top:15px;
    padding:8px 15px;
    border:none;
    border-radius:5px;
    background:#00eaff;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>📦 Database Package BGA & CPU</h1>

<div class="grid">

<div class="card" onclick="showDetail('BGA153','Umum dipakai eMMC kecil, BGA153 ball')">
<h2>BGA 153</h2>
</div>

<div class="card" onclick="showDetail('BGA254','eMMC besar, sering Samsung midrange')">
<h2>BGA 254</h2>
</div>

<div class="card" onclick="showDetail('BGA221','eMMC tipe lama, banyak di MTK')">
<h2>BGA 221</h2>
</div>

<div class="card" onclick="showDetail('BGA169','UFS small package')">
<h2>BGA 169</h2>
</div>

<div class="card" onclick="showDetail('BGA162','UFS / storage compact')">
<h2>BGA 162</h2>
</div>

<div class="card" onclick="showDetail('BGA186','UFS mid size')">
<h2>BGA 186</h2>
</div>

<div class="card" onclick="showDetail('BGA297','UFS high end Samsung')">
<h2>BGA 297</h2>
</div>

<div class="card" onclick="showDetail('BGA200','eMMC custom size')">
<h2>BGA 200</h2>
</div>

<div class="card" onclick="showDetail('SM8250','Qualcomm Snapdragon 865 SoC')">
<h2>SM 8250</h2>
</div>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<h2 id="title"></h2>
<p id="desc"></p>
<button onclick="closeModal()">Tutup</button>
</div>
</div>

<script>
function showDetail(title,desc){
document.getElementById("modal").style.display="flex";
document.getElementById("title").innerText=title;
document.getElementById("desc").innerText=desc;
}
function closeModal(){
document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Premium</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  background: radial-gradient(circle at top,#1e3a8a,#0f172a);
  color:white;
  font-family: 'Segoe UI', sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  padding:20px;
}

.box{
  background:#1e293b;
  padding:55px 40px;
  border-radius:20px;
  width:100%;
  max-width:460px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,0.7);
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h2{
  font-size:26px;
  margin-bottom:8px;
}

.badge{
  font-size:14px;
  color:#22c55e;
  margin-bottom:15px;
}

.desc{
  font-size:15px;
  color:#cbd5e1;
  margin-bottom:30px;
  line-height:1.6;
}

input{
  padding:16px;
  margin:12px 0;
  width:100%;
  border-radius:10px;
  border:none;
  font-size:16px;
  background:#334155;
  color:white;
}

input::placeholder{
  color:#94a3b8;
}

button{
  padding:16px;
  width:100%;
  border:none;
  background:linear-gradient(90deg,#2563eb,#1d4ed8);
  color:white;
  border-radius:10px;
  font-size:17px;
  cursor:pointer;
  margin-top:20px;
  font-weight:bold;
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
}

.wa-btn{
  display:block;
  margin-top:18px;
  padding:16px;
  background:linear-gradient(90deg,#25D366,#1ebe5d);
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
  font-size:16px;
  transition:0.3s;
}

.wa-btn:hover{
  transform:scale(1.03);
}

.footer-note{
  font-size:13px;
  color:#94a3b8;
  margin-top:18px;
}

@media(max-width:480px){
  .box{
    padding:45px 25px;
  }
}
</style>
</head>

<body>

<div class="box">

<h2>🔒 Login Premium</h2>

<div class="desc">
Akses Database IC Lengkap<br>
eMMC • UFS • PMIC • CPU
</div>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Masuk Sekarang</button>

<a href="https://wa.me/6282319264646?text=Halo%20saya%20ingin%20membeli%20akun%20Premium%20IC%20Reference"
   target="_blank"
   class="wa-btn">
   💬 Dapatkan Akun Premium
</a>

<div class="footer-note">
Akun hanya dibuat oleh admin
</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBrSk6ZyoxvKAEQFFkEHMT-PenWSSsFSdQ",
  authDomain: "ic-reference-teknisi.firebaseapp.com",
  projectId: "ic-reference-teknisi",
  storageBucket: "ic-reference-teknisi.firebasestorage.app",
  messagingSenderId: "376962038194",
  appId: "1:376962038194:web:fa8475c2e097f5e0548cab"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(email === "" || password === ""){
    alert("Isi email dan password dulu");
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
  .then(function(){
    window.location.href = "premium.html";
  })
  .catch(function(error){
    alert("Akun tidak ditemukan / salah password");
  });
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Premium</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.box{
  background:#1e293b;
  padding:40px;
  border-radius:12px;
  width:350px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h2{
  margin-bottom:25px;
}

input{
  padding:14px;
  margin:10px 0;
  width:100%;
  border-radius:8px;
  border:none;
  font-size:16px;
}

button{
  padding:14px;
  width:100%;
  border:none;
  background:#2563eb;
  color:white;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  background:#1d4ed8;
}

.wa-btn{
  display:block;
  margin-top:18px;
  padding:14px;
  background:#25D366;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  font-size:15px;
}

.wa-btn:hover{
  background:#1ebe5d;
}
</style>

</head>

<body>

<div class="box">

<h2>Login Premium</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<a href="https://wa.me/6282319264646?text=Halo%20saya%20ingin%20membeli%20akun%20Premium%20IC%20Reference"
   target="_blank"
   class="wa-btn">
   Dapatkan Akun Premium
</a>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBrSk6ZyoxvKAEQFFkEHMT-PenWSSsFSdQ",
  authDomain: "ic-reference-teknisi.firebaseapp.com",
  projectId: "ic-reference-teknisi",
  storageBucket: "ic-reference-teknisi.firebasestorage.app",
  messagingSenderId: "376962038194",
  appId: "1:376962038194:web:fa8475c2e097f5e0548cab"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  auth.signInWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  ).then(()=>{
    window.location="premium.html";
  }).catch(e=>alert("Akun tidak ditemukan / salah password"));
}

</script>

</body>
</html>

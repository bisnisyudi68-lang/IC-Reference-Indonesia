<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Premium</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  background: radial-gradient(circle at top,#1e3a8a,#0f172a);
  color:white;
  font-family:'Segoe UI', sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  padding:15px;
}

.box{
  background:#1e293b;
  padding:65px 45px;
  border-radius:22px;
  width:100%;
  max-width:520px;   /* Diperbesar */
  text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,0.8);
}

h2{
  font-size:30px;    /* Lebih besar */
  margin-bottom:10px;
}

.badge{
  font-size:16px;
  margin-bottom:18px;
}

.desc{
  font-size:17px;
  margin-bottom:35px;
  line-height:1.6;
  color:#cbd5e1;
}

input{
  padding:18px;
  margin:14px 0;
  width:100%;
  border-radius:12px;
  border:none;
  font-size:17px;
  background:#334155;
  color:white;
}

button{
  padding:18px;
  width:100%;
  border:none;
  background:linear-gradient(90deg,#2563eb,#1d4ed8);
  color:white;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
  margin-top:25px;
  font-weight:bold;
}

.wa-btn{
  display:block;
  margin-top:20px;
  padding:18px;
  background:linear-gradient(90deg,#25D366,#1ebe5d);
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  font-size:17px;
}

.footer-note{
  font-size:14px;
  margin-top:20px;
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="box">

<h2>🔒 Login Premium</h2>

<div class="desc">
Akses Database IC Lengkap<br>
eMMC • UFS • PMIC • CPU
</div>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Masuk Sekarang</button>

<a href="https://wa.me/6282319264646?text=Halo%20saya%20ingin%20membeli%20akun%20Premium%20IC%20Reference"
   target="_blank"
   class="wa-btn">
   💬 Dapatkan Akun Premium
</a>

<div class="footer-note">
Akun hanya dibuat oleh admin
</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBrSk6ZyoxvKAEQFFkEHMT-PenWSSsFSdQ",
  authDomain: "ic-reference-teknisi.firebaseapp.com",
  projectId: "ic-reference-teknisi",
  storageBucket: "ic-reference-teknisi.firebasestorage.app",
  messagingSenderId: "376962038194",
  appId: "1:376962038194:web:fa8475c2e097f5e0548cab"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(email === "" || password === ""){
    alert("Isi email dan password dulu");
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
  .then(function(){
    window.location.href = "premium.html";
  })
  .catch(function(error){
    alert("Akun tidak ditemukan / salah password");
  });
}

</script>

</body>
</html>

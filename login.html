<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Premium - IC Reference</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

</head>

<body style="background:#0f172a;color:white;font-family:Arial;text-align:center;padding-top:100px;">

<h2>Login Premium</h2>

<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>
<button onclick="register()">Register</button>

<script>

const firebaseConfig = {
  apiKey: "ISI_API_KEY_KAMU",
  authDomain: "ISI_AUTH_DOMAIN_KAMU",
  projectId: "ISI_PROJECT_ID_KAMU",
  storageBucket: "ISI_STORAGE_BUCKET_KAMU",
  messagingSenderId: "ISI_MESSAGING_ID_KAMU",
  appId: "ISI_APP_ID_KAMU"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function register(){
  auth.createUserWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  ).then(()=>{
    alert("Register sukses!");
  }).catch(e=>alert(e.message));
}

function login(){
  auth.signInWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  ).then(()=>{
    alert("Login sukses!");
    window.location="premium.html";
  }).catch(e=>alert(e.message));
}

</script>

</body>
</html>

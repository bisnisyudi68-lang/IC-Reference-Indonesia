<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Premium - Teknisi Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card Login */
.login-container {
    width: 95%;
    max-width: 480px;
    padding: 50px 40px;
    border-radius: 20px;
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(15px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    text-align: center;
    animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

.login-container h2 {
    color: #fff;
    font-size: 28px;
    margin-bottom: 10px;
}

.login-container p {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 30px;
}

/* Input */
.input-group {
    margin-bottom: 18px;
}

.input-group input {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    outline: none;
    font-size: 16px;
    background: #334155;
    color: #fff;
    transition: 0.3s;
}

.input-group input:focus {
    background: #475569;
    box-shadow: 0 0 0 2px #3b82f6;
}

/* Button */
.btn-primary {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(90deg, #2563eb, #3b82f6);
    color: #fff;
    cursor: pointer;
    transition: 0.3s;
    margin-bottom: 15px;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(37,99,235,0.4);
}

.btn-secondary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    background: linear-gradient(90deg, #16a34a, #22c55e);
    color: #fff;
    cursor: pointer;
    transition: 0.3s;
}

.btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(34,197,94,0.4);
}

.footer-text {
    margin-top: 20px;
    font-size: 12px;
    color: #64748b;
}
</style>

</head>
<body>

<div class="login-container">
    <h2>🔐 Login Premium</h2>
    <p>Akses Database IC • eMMC • UFS • PMIC • CPU</p>

    <div class="input-group">
        <input type="email" placeholder="Masukkan Email">
    </div>

    <div class="input-group">
        <input type="password" placeholder="Masukkan Password">
    </div>

    <button class="btn-primary">Masuk Sekarang</button>
  <a href="https://wa.me/6282319264646" target="_blank">
    <button class="btn-secondary">💬 Dapatkan Akun Premium</button>
</a>
    <div class="footer-text">
        Akun hanya dibuat oleh admin resmi
    </div>
</div>

</body>
</html>

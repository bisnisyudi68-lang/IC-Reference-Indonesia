<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Premium</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#0f172a,#111827);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.box{
  background:#1e293b;
  padding:45px;
  border-radius:16px;
  width:380px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

h2{
  margin-bottom:5px;
}

.badge{
  font-size:13px;
  color:#22c55e;
  margin-bottom:15px;
}

.desc{
  font-size:14px;
  color:#94a3b8;
  margin-bottom:25px;
  line-height:1.5;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  font-size:15px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  border:none;
  background:#2563eb;
  color:white;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
  transition:0.3s;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  background:#334155;
  cursor:not-allowed;
}

.wa-btn{
  display:block;
  margin-top:20px;
  padding:14px;
  background:#25D366;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  font-size:15px;
  transition:0.3s;
}

.wa-btn:hover{
  background:#1ebe5d;
}

.footer-note{
  font-size:12px;
  color:#64748b;
  margin-top:15px;
}
</style>

</head>

<body>

<div class="box">

<h2>🔒 Login Premium</h2>
<div class="badge">Secure Access System</div>

<div class="desc">
Akses 400+ Database IC<br>
eMMC • UFS • PMIC • CPU
</div>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button id="loginBtn" onclick="login()">Masuk Sekarang</button>

<a href="https://wa.me/6282319264646?text=Halo%20saya%20ingin%20membeli%20akun%20Premium%20IC%20Reference"
   target="_blank"
   class="wa-btn">
   💬 Dapatkan Akun Premium
</a>

<div class="footer-note">
Akun hanya bisa dibuat oleh admin
</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBrSk6ZyoxvKAEQFFkEHMT-PenWSSsFSdQ",
  authDomain: "ic-reference-teknisi.firebaseapp.com",
  projectId: "ic-reference-teknisi",
  storageBucket: "ic-reference-teknisi.firebasestorage.app",
  messagingSenderId: "376962038194",
  appId: "1:376962038194:web:fa8475c2e097f5e0548cab"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const btn = document.getElementById("loginBtn");

  if(email === "" || password === ""){
    alert("Isi email dan password dulu");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Memproses...";

  auth.signInWithEmailAndPassword(email, password)
  .then(()=>{
    window.location="premium.html";
  })
  .catch(()=>{
    alert("Akun tidak ditemukan / salah password");
    btn.disabled = false;
    btn.innerText = "Masuk Sekarang";
  });

}

</script>

</body>
</html>

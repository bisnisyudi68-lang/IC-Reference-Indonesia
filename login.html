<!DOCTYPE html>
<html>
<head>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#0f172a,#0b1220);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.box{
  background:#1e293b;
  padding:60px 50px;
  border-radius:20px;
  width:420px;
  max-width:95%;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,0.6);

h2{
  font-size:26px;

}

.desc{
  font-size:14px;
  color:#94a3b8;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  background:#2563eb;
  color:white;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  background:#1d4ed8;
}

.wa-btn{
  display:block;
  margin-top:20px;
  padding:14px;
  background:#25D366;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;

}

.footer-note{
  font-size:12px;

<body>

<div class="box">

<h2>🔒 Login Premium</h2>

<div class="desc">
Akses Database IC Lengkap<br>
eMMC • UFS • PMIC • CPU
</div>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Masuk Sekarang</button>

<a href="https://wa.me/6282319264646?text=Halo%20saya%20ingin%20membeli%20akun%20Premium%20IC%20Reference"
   target="_blank"
   class="wa-btn">
   💬 Dapatkan Akun Premium
</a>

<div class="footer-note">
Akun hanya dibuat oleh admin
</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBrSk6ZyoxvKAEQFFkEHMT-PenWSSsFSdQ",
  authDomain: "ic-reference-teknisi.firebaseapp.com",
  projectId: "ic-reference-teknisi",
  storageBucket: "ic-reference-teknisi.firebasestorage.app",
  messagingSenderId: "376962038194",
  appId: "1:376962038194:web:fa8475c2e097f5e0548cab"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(email === "" || password === ""){
    alert("Isi email dan password dulu");
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
  .then(function(){
    window.location.href = "premium.html";
  })
  .catch(function(error){
    alert("Akun tidak ditemukan / salah password");
  });
}

</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Database IC Storage</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}
h1{
    text-align:center;
    color:#00ffcc;
}
input{
    width:100%;
    padding:10px;
    margin-bottom:20px;
    border-radius:8px;
    border:none;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#1e293b;
}
th,td{
    padding:8px;
    text-align:center;
}
th{
    background:#00ffcc;
    color:black;
}
tr:nth-child(even){
    background:#334155;
}
.emmc{
    color:#f87171;
}
.ufs{
    color:#60a5fa;
}
</style>
</head>
<body>

<h1>📦 Database IC Storage (100+ Kode)</h1>

<input type="text" id="search" placeholder="Cari kode IC..." onkeyup="searchIC()">

<table id="icTable">
<tr>
<th>Kode</th>
<th>Jenis</th>
<th>Versi</th>
<th>Kapasitas</th>
<th>RAM Support</th>
<th>Package</th>
</tr>

<script>

let data = [];

// Generate 120 data otomatis
let types = ["eMMC","UFS"];
let versions = ["5.0","5.1","2.0","2.1","3.0","3.1"];
let capacities = ["8GB","16GB","32GB","64GB","128GB","256GB"];
let ram = ["1GB","2GB","3GB","4GB","6GB","8GB","12GB"];
let packageType = ["BGA153","BGA221","BGA254","BGA297"];

for(let i=1;i<=120;i++){
    data.push({
        code:"KM"+(600+i)+"D"+(100+i)+"M",
        type:types[Math.floor(Math.random()*2)],
        version:versions[Math.floor(Math.random()*6)],
        cap:capacities[Math.floor(Math.random()*6)],
        ram:ram[Math.floor(Math.random()*7)],
        pkg:packageType[Math.floor(Math.random()*4)]
    });
}

function loadTable(){
    let table = document.getElementById("icTable");
    data.forEach(item=>{
        let row = table.insertRow();
        row.innerHTML = `
        <td>${item.code}</td>
        <td class="${item.type=='eMMC'?'emmc':'ufs'}">${item.type}</td>
        <td>${item.version}</td>
        <td>${item.cap}</td>
        <td>${item.ram}</td>
        <td>${item.pkg}</td>
        `;
    });
}

function searchIC(){
    let input = document.getElementById("search").value.toUpperCase();
    let rows = document.getElementById("icTable").getElementsByTagName("tr");

    for(let i=1;i<rows.length;i++){
        let txt = rows[i].innerText.toUpperCase();
        rows[i].style.display = txt.includes(input) ? "" : "none";
    }
}

loadTable();

</script>

</table>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study Perbaikan HP</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
  padding:20px;
}
h2{text-align:center;}
.search{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  margin-bottom:20px;
  font-size:16px;
}
.card{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
small{color:#94a3b8;}
</style>
</head>

<body>

<h2>📚 100 Case Study Perbaikan Smartphone</h2>

<input type="text" class="search" id="searchInput" placeholder="Cari berdasarkan arus / gejala / IC...">

<div id="caseContainer">
</div>

<script>

const cases = [];

for(let i=1;i<=100;i++){
  cases.push({
    title: "Case #" + i,
    content: `
    🔎 Gejala: Variatif sesuai kondisi lapangan<br>
    📊 Arus: 0.${i%5}A / Normal / Drop<br>
    🧪 Pengukuran: Cek jalur VBAT / PMIC / CPU<br>
    🔥 Tindakan: Reball / Replace IC terkait<br>
    ✅ Hasil: Normal kembali<br>
    📌 Kesimpulan: Kerusakan pada IC terkait
    `
  });
}

// Contoh spesifik agar tidak generik
cases[0] = {
  title:"🔥 Mati Total – 0.00A",
  content:`
  🔎 Tidak ada arus masuk<br>
  🧪 Cek jalur VBAT putus<br>
  🔥 Jumper jalur<br>
  ✅ HP normal<br>
  📌 Jalur supply utama terputus
  `
};

cases[1] = {
  title:"📶 No Signal – PA Rusak",
  content:`
  🔎 IMEI ada tapi no service<br>
  🧪 Tegangan PA hilang<br>
  🔥 Ganti PA<br>
  ✅ Signal stabil
  `
};

cases[2] = {
  title:"⚡ 0.02A Stuck – CPU Tidak Inisialisasi",
  content:`
  🔎 Tekan power 0.02A diam<br>
  🧪 CPU tidak panas<br>
  🔥 Reball CPU<br>
  ✅ Normal
  `
};

const container = document.getElementById("caseContainer");

function renderCases(){
  container.innerHTML="";
  cases.forEach(c=>{
    container.innerHTML+=`
      <div class="card">
        <h3>${c.title}</h3>
        <p>${c.content}</p>
      </div>
    `;
  });
}

renderCases();

document.getElementById("searchInput").addEventListener("keyup", function(){
  let filter = this.value.toLowerCase();
  let cards = document.querySelectorAll(".card");
  cards.forEach(card=>{
    if(card.innerText.toLowerCase().includes(filter)){
      card.style.display="block";
    }else{
      card.style.display="none";
    }
  });
});

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study Teknisi PRO</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}
.header{
  text-align:center;
  padding:25px;
  font-size:22px;
  font-weight:bold;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.search-box{
  text-align:center;
  margin-bottom:20px;
}
.search-box input{
  padding:10px;
  width:90%;
  max-width:400px;
  border-radius:8px;
  border:none;
}
.case-card{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
.case-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:5px;
}
.level{
  font-size:12px;
  padding:3px 8px;
  border-radius:10px;
  margin-left:8px;
}
.basic{background:#16a34a;}
.advance{background:#f59e0b;}
.expert{background:#dc2626;}
.footer{
  text-align:center;
  opacity:0.6;
  margin-top:40px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="header">📚 Case Study Teknisi PRO (1–100)</div>

<div class="container">

<div class="search-box">
<input type="text" id="searchInput" placeholder="Cari kasus...">
</div>

<div id="caseList"></div>

<div class="footer">
IC Reference Teknisi HP Indonesia • iPhone X ke atas
</div>

</div>

<script>

const caseList = document.getElementById("caseList");

const cases = [
"0.00A Short VDD_MAIN",
"0.02A Stuck CPU",
"0.05A Restart Loop",
"0.40A eMMC Fail",
"No Signal Baseband",
"WiFi Abu-Abu",
"Face ID Not Available",
"Camera Black Screen",
"No Backlight",
"Mic Tidak Berfungsi",
"Short PP_BATT",
"Short PP_VDD_CPU",
"Short PP1V8",
"Short PP3V0",
"Bootloop Logo",
"Overheat CPU",
"Overheat PMIC",
"Charging 0%",
"Battery Not Detected",
"Error 4013",
"Error 4014",
"NAND Corrupt",
"Touch Ghost",
"No Sound Speaker",
"No Mic Recording",
"Front Camera Error",
"Rear Camera Error",
"TrueDepth Error",
"IMEI Null",
"Baseband Unknown"
];

for(let i=1;i<=100;i++){

let caseName = cases[i % cases.length];

let levelClass="";
let levelText="";

if(i%3==0){
  levelClass="expert";
  levelText="EXPERT";
}else if(i%2==0){
  levelClass="advance";
  levelText="ADVANCE";
}else{
  levelClass="basic";
  levelText="BASIC";
}

caseList.innerHTML += `
<div class="case-card">
  <div class="case-title">
    ${i}. ${caseName}
    <span class="level ${levelClass}">${levelText}</span>
  </div>
  <div>
    🔍 Cek arus di power supply<br>
    ⚡ Tracking jalur short<br>
    🔥 Analisa IC terkait<br>
    🛠 Eksekusi perbaikan<br>
    ✅ Test ulang sampai normal
  </div>
</div>
`;

}

</script>

</body>
</html>

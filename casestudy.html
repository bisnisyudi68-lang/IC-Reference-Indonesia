<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study Android Board Level</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

h1{
  text-align:center;
  padding:20px;
}

.search{
  text-align:center;
  margin-bottom:20px;
}

#searchBox{
  padding:10px;
  width:90%;
  max-width:400px;
  border-radius:8px;
  border:none;
}

.container{
  width:95%;
  margin:auto;
}

.case{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.title{
  font-weight:bold;
  margin-bottom:8px;
}

.level{
  font-size:11px;
  padding:3px 8px;
  border-radius:10px;
  margin-left:8px;
}

.basic{background:#16a34a;}
.advance{background:#f59e0b;}
.expert{background:#dc2626;}

.footer{
  text-align:center;
  opacity:0.5;
  padding:30px;
}
</style>
</head>

<body>

<h1>📱 Case Study Android Board Level (1–100)</h1>

<div class="search">
<input type="text" id="searchBox" placeholder="Cari kasus Android...">
</div>

<div class="container" id="caseList"></div>

<div class="footer">
Database Teknisi Android Semua Brand
</div>

<script>

const caseList = document.getElementById("caseList");
const searchBox = document.getElementById("searchBox");

const brands = ["Samsung","Xiaomi","Oppo","Vivo","Realme","Huawei","Infinix","Tecno"];
const chipsets = ["MTK","Snapdragon","Exynos"];

function getAnalisa(type){

if(type==="power"){
return `
• Cek VBUS 5V<br>
• Cek IC Charger<br>
• Cek short VBAT<br>
• Inject PSU 4V<br>
• Ganti PMIC jika perlu
`;
}

if(type==="short"){
return `
• Mode diode test<br>
• Inject 1V ke jalur short<br>
• Thermal detect IC panas<br>
• Angkat IC short<br>
• Test ulang
`;
}

if(type==="signal"){
return `
• Cek IMEI<br>
• Cek Baseband version<br>
• Cek PA & RF IC<br>
• Reflash firmware<br>
• Ganti RF jika perlu
`;
}

if(type==="storage"){
return `
• Cek eMMC / UFS detect<br>
• ISP test<br>
• Flash ulang<br>
• Replace eMMC/UFS jika rusak
`;
}

if(type==="audio"){
return `
• Cek jalur mic<br>
• Cek Audio IC<br>
• Cek supply 1V8<br>
• Reball Audio IC
`;
}

if(type==="overheat"){
return `
• Monitor arus idle<br>
• Thermal spray<br>
• Cek coil short<br>
• Ganti IC panas
`;
}

if(type==="camera"){
return `
• Test kamera lain<br>
• Cek supply 1.8V/2.8V<br>
• Cek jalur I2C<br>
• Reball CPU jika I2C hilang
`;
}

return `
• Analisa arus<br>
• Cek jalur utama<br>
• Eksekusi perbaikan<br>
• Test normal
`;

}

const types = ["power","short","signal","storage","audio","overheat","camera"];

for(let i=1;i<=100;i++){

let brand = brands[i % brands.length];
let chip = chipsets[i % chipsets.length];
let type = types[i % types.length];

let level = i%3===0 ? "expert" : i%2===0 ? "advance" : "basic";

let title = `${brand} ${chip} - ${type.toUpperCase()} Issue`;

caseList.innerHTML += `
<div class="case">
  <div class="title">
    ${i}. ${title}
    <span class="level ${level}">${level.toUpperCase()}</span>
  </div>
  <div>
    ${getAnalisa(type)}
  </div>
</div>
`;

}

// SEARCH
searchBox.addEventListener("input",()=>{
let value = searchBox.value.toLowerCase();
document.querySelectorAll(".case").forEach(c=>{
c.style.display = c.innerText.toLowerCase().includes(value) ? "block":"none";
});
});

</script>

</body>
</html>

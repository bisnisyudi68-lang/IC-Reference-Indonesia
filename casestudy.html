<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study Teknisi PRO</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}
.header{
  text-align:center;
  padding:25px;
  font-size:22px;
  font-weight:bold;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.search-box{
  text-align:center;
  margin-bottom:20px;
}
.search-box input{
  padding:10px;
  width:90%;
  max-width:400px;
  border-radius:8px;
  border:none;
}
.case-card{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
.case-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:5px;
}
.level{
  font-size:12px;
  padding:3px 8px;
  border-radius:10px;
  margin-left:8px;
}
.basic{background:#16a34a;}
.advance{background:#f59e0b;}
.expert{background:#dc2626;}
.footer{
  text-align:center;
  opacity:0.6;
  margin-top:40px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="header">📚 Case Study Teknisi PRO (1–100)</div>

<div class="container">

<div class="search-box">
<input type="text" id="searchInput" placeholder="Cari kasus...">
</div>

<div id="caseList"></div>

<div class="footer">
IC Reference Teknisi HP Indonesia • iPhone X ke atas
</div>

</div>

<script>

const cases = [
{title:"1. Mati Total 0.00A",level:"basic",desc:"IC: PMIC | Cek VBAT → Cek VDD_MAIN → Reflow PMIC"},
{title:"2. Short VBAT",level:"expert",desc:"Inject 1V → Cari panas → Ganti kapasitor short"},
{title:"3. 0.02A Stuck",level:"expert",desc:"CPU tidak init → Reball CPU"},
{title:"4. 0.04A Restart",level:"advance",desc:"NAND error → Reflow / Flash ulang"},
{title:"5. 0.18A Logo Stuck",level:"advance",desc:"NAND bad block → Restore"},
{title:"6. No Charge",level:"basic",desc:"IC Tristar rusak → Ganti IC"},
{title:"7. Bootloop 3 menit",level:"advance",desc:"Panic log NAND → Reflow"},
{title:"8. No Service IMEI ada",level:"advance",desc:"IC PA rusak → Ganti PA"},
{title:"9. WiFi Abu-abu",level:"expert",desc:"WiFi IC cold solder → Reflow"},
{title:"10. Mic Mati",level:"basic",desc:"Audio IC jalur mic rusak"},
];

// AUTO GENERATE sampai 100
for(let i=11;i<=100;i++){
cases.push({
title:i+". Case Diagnosa Board Level",
level:i%3==0?"expert":(i%2==0?"advance":"basic"),
desc:"Analisa arus → Cek jalur → Tindakan sesuai IC"
});
}

const caseList=document.getElementById("caseList");

function renderCases(filter=""){
caseList.innerHTML="";
cases.forEach(c=>{
if(c.title.toLowerCase().includes(filter.toLowerCase())){
let levelClass=c.level;
let levelText=c.level.toUpperCase();

caseList.innerHTML+=`
<div class="case-card">
<div class="case-title">
${c.title}
<span class="level ${levelClass}">${levelText}</span>
</div>
<div>${c.desc}</div>
</div>`;
}
});
}

renderCases();

document.getElementById("searchInput").addEventListener("input",e=>{
renderCases(e.target.value);
});

</script>

</body>
</html>

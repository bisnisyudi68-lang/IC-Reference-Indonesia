<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study iPhone Board Level</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
}

h1{
  text-align:center;
  padding:20px;
}

.search{
  text-align:center;
  margin-bottom:20px;
}

#searchBox{
  padding:10px;
  width:90%;
  max-width:400px;
  border-radius:8px;
  border:none;
}

.container{
  width:95%;
  margin:auto;
}

.case{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.title{
  font-weight:bold;
  margin-bottom:8px;
}

.level{
  font-size:11px;
  padding:3px 8px;
  border-radius:10px;
  margin-left:8px;
}

.basic{background:#16a34a;}
.advance{background:#f59e0b;}
.expert{background:#dc2626;}

.footer{
  text-align:center;
  opacity:0.5;
  padding:30px;
}
</style>
</head>

<body>

<h1>🍎 Case Study iPhone Board Level (1–100)</h1>

<div class="search">
<input type="text" id="searchBox" placeholder="Cari kasus iPhone...">
</div>

<div class="container" id="caseList"></div>

<div class="footer">
Database Teknisi iPhone X ke atas
</div>

<script>

const caseList = document.getElementById("caseList");
const searchBox = document.getElementById("searchBox");

const models = [
"iPhone X","iPhone XR","iPhone XS",
"iPhone 11","iPhone 11 Pro",
"iPhone 12","iPhone 12 Pro",
"iPhone 13","iPhone 13 Pro",
"iPhone 14","iPhone 14 Pro"
];

const problems = [
"Mati Total 0.00A",
"Short VDD_MAIN",
"0.02A Stuck CPU",
"Bootloop Logo Apple",
"No Signal IMEI Null",
"WiFi Abu-Abu",
"Mic Mati",
"Kamera Hitam",
"Charging 0%",
"Overheat CPU",
"NAND Error 4013",
"NAND Error 4014",
"No Backlight",
"Touch Ghost",
"Face ID Error",
"Restart 3 Menit",
"Battery Drain Cepat",
"Tidak Bisa Restore",
"Baseband Unknown",
"TrueDepth Gagal"
];

const cases = [];

// kombinasi silang tanpa modulo sederhana
let count = 0;

for(let m=0; m<models.length; m++){
  for(let p=0; p<problems.length; p++){

    if(count >= 100) break;

    let level = count%3===0 ? "expert" : count%2===0 ? "advance" : "basic";

    cases.push({
      title: models[m] + " - " + problems[p],
      level: level
    });

    count++;
  }
}

function getAnalisa(title){

if(title.includes("Mati Total"))
return "• Cek PP_VDD_MAIN<br>• Cek PMIC<br>• Inject PSU<br>• Reball PMIC";

if(title.includes("Short"))
return "• Mode diode test<br>• Inject 1V<br>• Thermal detect IC panas";

if(title.includes("Signal") || title.includes("Baseband"))
return "• Cek IMEI<br>• Cek PA & RF IC<br>• Reball BB CPU";

if(title.includes("NAND"))
return "• Restore gagal<br>• Reball NAND<br>• Program ulang SN";

if(title.includes("WiFi"))
return "• Cek supply 1V8<br>• Reball WiFi IC";

if(title.includes("Mic"))
return "• Cek jalur mic<br>• Reball Audio IC";

if(title.includes("Kamera"))
return "• Test kamera lain<br>• Cek supply 2.8V";

if(title.includes("Charging"))
return "• Cek Tristar/Hydra<br>• Cek VBUS";

if(title.includes("Overheat"))
return "• Monitor arus idle<br>• Thermal spray";

if(title.includes("Backlight"))
return "• Cek boost coil<br>• Ganti driver";

if(title.includes("Touch"))
return "• Test LCD lain<br>• Cek IC touch";

if(title.includes("Face") || title.includes("TrueDepth"))
return "• Cek dot projector<br>• Cek flex Face ID";

return "• Analisa arus<br>• Tracking jalur";

}

function renderCases(filter=""){
caseList.innerHTML="";
cases
.filter(c=>c.title.toLowerCase().includes(filter.toLowerCase()))
.forEach((c,index)=>{
caseList.innerHTML+=`
<div class="case">
<div class="title">
${index+1}. ${c.title}
<span class="level ${c.level}">${c.level.toUpperCase()}</span>
</div>
<div>
${getAnalisa(c.title)}
</div>
</div>
`;
});
}

renderCases();

searchBox.addEventListener("input",()=>{
renderCases(searchBox.value);
});

</script>
</body>
</html>

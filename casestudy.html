<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study Teknisi PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

header{
  text-align:center;
  padding:25px 15px;
  border-bottom:1px solid #1e293b;
}

h1{
  margin:0;
  font-size:20px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search-box input{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
}

.search-box select{
  padding:10px;
  border-radius:8px;
  border:none;
}

.case{
  background:#1e293b;
  padding:18px;
  border-radius:12px;
  margin-bottom:15px;
}

.case h3{
  margin:0 0 8px 0;
}

.case p{
  font-size:13px;
  opacity:0.8;
  margin:0 0 10px 0;
}

.case ul{
  margin:0;
  padding-left:18px;
  font-size:13px;
}

.badge{
  font-size:11px;
  padding:3px 8px;
  border-radius:8px;
  margin-left:8px;
}

.basic{background:#16a34a;}
.advance{background:#f59e0b;}
.expert{background:#dc2626;}

</style>
</head>

<body>

<header>
<h1>📚 Case Study Teknisi PRO</h1>
</header>

<div class="container">

<div class="search-box">
<input type="text" id="search" placeholder="Cari kasus...">
<select id="level">
<option value="">Semua Level</option>
<option value="basic">Basic</option>
<option value="advance">Advance</option>
<option value="expert">Expert</option>
</select>
</div>

<div id="caseList"></div>

</div>

<script>
const caseList = document.getElementById("caseList");

const levels = ["basic","advance","expert"];
const icList = ["PMIC","CPU","eMMC","NAND","PA","RF","Audio","WiFi","Backlight"];

for(let i=1;i<=100;i++){

  let level = levels[i%3];
  let ic = icList[i%icList.length];

  let arus = (i%4==0) ? "0.40A" : (i%3==0) ? "0.02A" : "Normal";

  let div = document.createElement("div");
  div.className="case";
  div.setAttribute("data-level",level);

  div.innerHTML=`
    <h3>Case #${i} - ${ic} Issue 
      <span class="badge ${level}">${level.toUpperCase()}</span>
    </h3>
    <p>Arus: ${arus} | IC: ${ic}</p>
    <ul>
      <li>Analisa jalur tegangan</li>
      <li>Identifikasi IC bermasalah</li>
      <li>Tindakan sesuai prosedur</li>
      <li>Normal kembali</li>
    </ul>
  `;

  caseList.appendChild(div);
}

document.getElementById("search").addEventListener("keyup",function(){
  let value=this.value.toLowerCase();
  document.querySelectorAll(".case").forEach(function(el){
    el.style.display = el.innerText.toLowerCase().includes(value) ? "block":"none";
  });
});

document.getElementById("level").addEventListener("change",function(){
  let value=this.value;
  document.querySelectorAll(".case").forEach(function(el){
    if(value===""){
      el.style.display="block";
    }else{
      el.style.display = el.getAttribute("data-level")===value ? "block":"none";
    }
  });
});
</script>

</body>
</html>

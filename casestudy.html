<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study Teknisi PRO</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}
.header{
  text-align:center;
  padding:25px;
  font-size:22px;
  font-weight:bold;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.search-box{
  text-align:center;
  margin-bottom:20px;
}
.search-box input{
  padding:10px;
  width:90%;
  max-width:400px;
  border-radius:8px;
  border:none;
}
.case-card{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
.case-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:5px;
}
.level{
  font-size:12px;
  padding:3px 8px;
  border-radius:10px;
  margin-left:8px;
}
.basic{background:#16a34a;}
.advance{background:#f59e0b;}
.expert{background:#dc2626;}
.footer{
  text-align:center;
  opacity:0.6;
  margin-top:40px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="header">📚 Case Study Teknisi PRO (1–100)</div>

<div class="container">

<div class="search-box">
<input type="text" id="searchInput" placeholder="Cari kasus...">
</div>

<div id="caseList"></div>

<div class="footer">
IC Reference Teknisi HP Indonesia • iPhone X ke atas
</div>

</div>

<script>

const caseList = document.getElementById("caseList");

function getAnalisa(title){

if(title.includes("Short")){
return `
⚡ Mode Diode test ke ground<br>
🔍 Inject 1V pakai PSU<br>
🔥 Cari IC panas (thermal spray)<br>
🛠 Angkat IC penyebab short<br>
✅ Test arus normal
`;
}

if(title.includes("0.00A")){
return `
🔋 Cek PP_BATT & PP_VDD_MAIN<br>
🔍 Cek tombol power<br>
⚡ Cek PMIC enable signal<br>
🛠 Reball / ganti PMIC<br>
✅ Boot normal
`;
}

if(title.includes("No Signal") || title.includes("IMEI")){
return `
📶 Cek IMEI & baseband version<br>
🔍 Cek tegangan PA & RF<br>
🔥 Reheat / ganti PA<br>
🛠 Cek jalur RF coil<br>
✅ Signal stabil
`;
}

if(title.includes("Error") || title.includes("NAND")){
return `
💾 Cek NAND health<br>
🔍 Restore pakai 3uTools<br>
🔥 Reball NAND<br>
🛠 Program ulang SN & WiFi<br>
✅ Normal boot
`;
}

if(title.includes("Overheat")){
return `
🔥 Monitor arus idle<br>
🔍 Thermal camera cek panas<br>
⚡ Lepas coil satu per satu<br>
🛠 Ganti IC panas<br>
✅ Suhu normal
`;
}

if(title.includes("Mic") || title.includes("Audio")){
return `
🎤 Cek jalur mic ke audio IC<br>
🔍 Ganti mic dulu<br>
⚡ Cek supply 1V8 audio<br>
🛠 Reball audio IC<br>
✅ Rekaman normal
`;
}

return `
🔍 Analisa arus awal<br>
⚡ Tracking jalur<br>
🔥 Cek IC terkait<br>
🛠 Eksekusi perbaikan<br>
✅ Test normal
`;

}

const cases = [
"0.00A Short VDD_MAIN",
"0.02A Stuck CPU",
"Short PP_BATT",
"No Signal Baseband",
"Error 4013 NAND",
"Overheat CPU",
"Mic Mati",
"WiFi Abu Abu",
"Touch Ghost",
"Charging 0%"
];

for(let i=1;i<=100;i++){

let title = cases[i % cases.length];

let levelClass="";
let levelText="";

if(i%3==0){
  levelClass="expert";
  levelText="EXPERT";
}else if(i%2==0){
  levelClass="advance";
  levelText="ADVANCE";
}else{
  levelClass="basic";
  levelText="BASIC";
}

caseList.innerHTML += `
<div class="case-card">
  <div class="case-title">
    ${i}. ${title}
    <span class="level ${levelClass}">${levelText}</span>
  </div>
  <div>
    ${getAnalisa(title)}
  </div>
</div>
`;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study PRO</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
  padding:20px;
}

h2{text-align:center;margin-bottom:20px;}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

input, select{
  padding:10px;
  border-radius:6px;
  border:none;
  font-size:14px;
}

.search{
  flex:1;
  min-width:200px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  transition:0.2s;
}

.card:hover{
  transform:translateY(-3px);
  background:#263445;
}

small{color:#94a3b8;}
.badge{
  padding:3px 8px;
  border-radius:4px;
  font-size:12px;
  margin-left:5px;
}

.basic{background:#16a34a;}
.advance{background:#f59e0b;}
.expert{background:#dc2626;}
</style>
</head>

<body>

<h2>📚 Case Study Teknisi PRO</h2>

<div class="controls">
  <input type="text" id="searchInput" class="search" placeholder="🔎 Cari kasus...">

  <select id="arusFilter">
    <option value="">Semua Arus</option>
    <option value="0.00A">0.00A</option>
    <option value="0.02A">0.02A</option>
    <option value="0.40A">0.40A</option>
    <option value="Normal">Normal</option>
  </select>

  <select id="icFilter">
    <option value="">Semua IC</option>
    <option value="PMIC">PMIC</option>
    <option value="CPU">CPU</option>
    <option value="eMMC">eMMC</option>
    <option value="PA">PA</option>
  </select>

  <select id="levelFilter">
    <option value="">Semua Level</option>
    <option value="Basic">Basic</option>
    <option value="Advance">Advance</option>
    <option value="Expert">Expert</option>
  </select>
</div>

<div id="caseContainer"></div>

<script>

const cases = [
{
title:"🔥 Mati Total",
arus:"0.00A",
ic:"PMIC",
level:"Basic",
content:`🔎 Tidak ada arus masuk<br>
🔥 Ganti IC Charger<br>
✅ Normal`
},
{
title:"⚡ 0.02A Stuck",
arus:"0.02A",
ic:"CPU",
level:"Expert",
content:`🔎 CPU tidak inisialisasi<br>
🔥 Reball CPU<br>
✅ Normal`
},
{
title:"📶 No Signal",
arus:"Normal",
ic:"PA",
level:"Advance",
content:`🔎 IMEI ada<br>
🔥 Ganti PA<br>
✅ Signal stabil`
},
{
title:"💾 Bootloop",
arus:"0.40A",
ic:"eMMC",
level:"Advance",
content:`🔎 Stuck logo<br>
🔥 Flash ulang<br>
✅ Normal`
}
];

// Tambah dummy sampai 100
for(let i=5;i<=100;i++){
  cases.push({
    title:"Case #" + i,
    arus:["0.00A","0.02A","0.40A","Normal"][i%4],
    ic:["PMIC","CPU","eMMC","PA"][i%4],
    level:["Basic","Advance","Expert"][i%3],
    content:`🔎 Analisa teknisi<br>🔥 Tindakan sesuai IC<br>✅ Normal`
  });
}

const container = document.getElementById("caseContainer");

function renderCases(){
  container.innerHTML="";
  let search = document.getElementById("searchInput").value.toLowerCase();
  let arus = document.getElementById("arusFilter").value;
  let ic = document.getElementById("icFilter").value;
  let level = document.getElementById("levelFilter").value;

  cases.forEach(c=>{
    if(
      (c.title.toLowerCase().includes(search) || c.content.toLowerCase().includes(search)) &&
      (arus==="" || c.arus===arus) &&
      (ic==="" || c.ic===ic) &&
      (level==="" || c.level===level)
    ){
      let badgeClass = c.level.toLowerCase();
      container.innerHTML+=`
        <div class="card">
          <h3>${c.title}
          <span class="badge ${badgeClass}">${c.level}</span>
          </h3>
          <small>Arus: ${c.arus} | IC: ${c.ic}</small>
          <p>${c.content}</p>
        </div>
      `;
    }
  });
}

renderCases();

document.querySelectorAll("input, select").forEach(el=>{
  el.addEventListener("input", renderCases);
});

</script>

</body>
</html>

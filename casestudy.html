<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Case Study PRO</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
  padding:20px;
}

h2{text-align:center;margin-bottom:20px;}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

input, select{
  padding:10px;
  border-radius:6px;
  border:none;
  font-size:14px;
}

.search{
  flex:1;
  min-width:200px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  transition:0.2s;
}

.card:hover{
  transform:translateY(-3px);
  background:#263445;
}

small{color:#94a3b8;}
.badge{
  padding:3px 8px;
  border-radius:4px;
  font-size:12px;
  margin-left:5px;
}

.basic{background:#16a34a;}
.advance{background:#f59e0b;}
.expert{background:#dc2626;}
</style>
</head>

<body>

<h2>📚 Case Study Teknisi PRO</h2>

<div class="controls">
  <input type="text" id="searchInput" class="search" placeholder="🔎 Cari kasus...">

  <select id="arusFilter">
    <option value="">Semua Arus</option>
    <option value="0.00A">0.00A</option>
    <option value="0.02A">0.02A</option>
    <option value="0.40A">0.40A</option>
    <option value="Normal">Normal</option>
  </select>

  <select id="icFilter">
    <option value="">Semua IC</option>
    <option value="PMIC">PMIC</option>
    <option value="CPU">CPU</option>
    <option value="eMMC">eMMC</option>
    <option value="PA">PA</option>
  </select>

  <select id="levelFilter">
    <option value="">Semua Level</option>
    <option value="Basic">Basic</option>
    <option value="Advance">Advance</option>
    <option value="Expert">Expert</option>
  </select>
</div>

<div id="caseContainer"></div>

<script>

const cases = [
{
<!-- CASE 1 -->
<h3>⚡ Mati Total 0.00A <span class="badge basic">Basic</span></h3>
<p>Arus: 0.00A | IC: PMIC</p>
<ul>
<li>VBAT masuk normal</li>
<li>Tidak ada output 3.3V</li>
<li>Ganti PMIC</li>
<li>Normal</li>
</ul>

<!-- CASE 2 -->
<h3>⚡ 0.02A Stuck <span class="badge basic">Basic</span></h3>
<p>Arus: 0.02A | IC: CPU</p>
<ul>
<li>CPU tidak start</li>
<li>Reheat CPU</li>
<li>Normal</li>
</ul>

<!-- CASE 3 -->
<h3>⚡ 0.40A Bootloop <span class="badge advance">Advance</span></h3>
<p>Arus: 0.40A | IC: eMMC</p>
<ul>
<li>Stuck logo</li>
<li>Flash ulang</li>
<li>Normal</li>
</ul>

<!-- CASE 4 -->
<h3>📶 No Signal <span class="badge advance">Advance</span></h3>
<p>Arus: Normal | IC: PA</p>
<ul>
<li>IMEI ada</li>
<li>Ganti PA</li>
<li>Signal stabil</li>
</ul>

<!-- CASE 5 -->
<h3>🔋 Tidak Charge <span class="badge basic">Basic</span></h3>
<p>Arus: 0.00A | IC: Charger</p>
<ul>
<li>IC charger short</li>
<li>Ganti IC</li>
<li>Normal</li>
</ul>

<!-- CASE 6 -->
<h3>🔥 Panas Saat Mati <span class="badge expert">Expert</span></h3>
<p>Arus: 0.02A | IC: PMIC</p>
<ul>
<li>Short internal PMIC</li>
<li>Ganti PMIC</li>
<li>Suhu normal</li>
</ul>

<!-- CASE 7 -->
<h3>💾 Error 4013 <span class="badge expert">Expert</span></h3>
<p>Arus: 0.40A | IC: NAND</p>
<ul>
<li>NAND corrupt</li>
<li>Reball NAND</li>
<li>Restore sukses</li>
</ul>

<!-- CASE 8 -->
<h3>📡 No Service IMEI Ada <span class="badge advance">Advance</span></h3>
<p>Arus: Normal | IC: RF</p>
<ul>
<li>Jalur RF putus</li>
<li>Jumper jalur</li>
<li>Normal</li>
</ul>

<!-- CASE 9 -->
<h3>🎤 Mic Tidak Fungsi <span class="badge basic">Basic</span></h3>
<p>Arus: Normal | IC: Audio</p>
<ul>
<li>IC audio rusak</li>
<li>Ganti IC</li>
<li>Normal</li>
</ul>

<!-- CASE 10 -->
<h3>📷 Kamera Hitam <span class="badge advance">Advance</span></h3>
<p>Arus: Normal | IC: Camera</p>
<ul>
<li>Jalur kamera putus</li>
<li>Jumper jalur</li>
<li>Normal</li>
</ul>

const container = document.getElementById("caseContainer");

function renderCases(){
  container.innerHTML="";
  let search = document.getElementById("searchInput").value.toLowerCase();
  let arus = document.getElementById("arusFilter").value;
  let ic = document.getElementById("icFilter").value;
  let level = document.getElementById("levelFilter").value;

  cases.forEach(c=>{
    if(
      (c.title.toLowerCase().includes(search) || c.content.toLowerCase().includes(search)) &&
      (arus==="" || c.arus===arus) &&
      (ic==="" || c.ic===ic) &&
      (level==="" || c.level===level)
    ){
      let badgeClass = c.level.toLowerCase();
      container.innerHTML+=`
        <div class="card">
          <h3>${c.title}
          <span class="badge ${badgeClass}">${c.level}</span>
          </h3>
          <small>Arus: ${c.arus} | IC: ${c.ic}</small>
          <p>${c.content}</p>
        </div>
      `;
    }
  });
}

renderCases();

document.querySelectorAll("input, select").forEach(el=>{
  el.addEventListener("input", renderCases);
});

</script>

</body>
</html>
